<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mut:#667085; --line:#e3e6ea; --acc:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141a; --card:#1a1d25; --ink:#e8eaee; --mut:#98a2b3; --line:#2a2e38; --acc:#818cf8; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  button { font:inherit; padding:9px 14px; border:0; border-radius:10px; background:var(--acc); color:#fff; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; } li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--mut); }
  li button { background:none; color:var(--mut); padding:2px 8px; }
  #msg { color:var(--mut); margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="f"><input id="t" type="text" placeholder="Yeni görev…" maxlength="200" autocomplete="off"><button>Ekle</button></form>
  <ul id="list"></ul>
  <div id="msg"></div>
</main>
<script>
const list = document.getElementById('list'), msg = document.getElementById('msg'), input = document.getElementById('t');
async function api(method, path, body) {
  const r = await fetch('/api/todos' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'hata');
  return data;
}
async function render() {
  const todos = await api('GET', '');
  list.replaceChildren();
  todos.forEach(t => {
    const li = document.createElement('li'); if (t.done) li.className = 'done';
    const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
    cb.onchange = () => act(() => api('PATCH', '/' + t.id, { done: cb.checked }));
    const span = Object.assign(document.createElement('span'), { textContent: t.title });
    const del = Object.assign(document.createElement('button'), { textContent: '✕', title: 'Sil' });
    del.onclick = () => act(() => api('DELETE', '/' + t.id));
    li.append(cb, span, del); list.append(li);
  });
  const left = todos.filter(t => !t.done).length;
  msg.textContent = todos.length ? `${left} görev kaldı, ${todos.length} toplam` : 'Henüz görev yok.';
}
async function act(fn) { try { await fn(); await render(); } catch (e) { msg.textContent = 'Hata: ' + e.message; } }
document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = input.value; input.value = ''; act(() => api('POST', '', { title: v })); };
render();
</script>
</body>
</html>
